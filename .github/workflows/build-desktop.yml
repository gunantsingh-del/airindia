# =====================================================================
# AIVA Desktop · MANUAL build only.
#
# We no longer auto-build on every push — the .exe lives as a static
# asset in the repo (/AIVA-Setup.exe), bound directly to the Install
# button. No releases, no API, no caching.
#
# Use this workflow only when you actually want a fresh build:
#   GitHub → Actions tab → "Build AIVA Desktop (.exe)" → Run workflow
#
# On a successful run, download AIVA-Setup.exe from the workflow's
# Artifacts panel and commit it to the repo root (overwriting the
# existing /AIVA-Setup.exe). Vercel auto-deploys; the install link
# now serves the new build.
# =====================================================================

name: Build AIVA Desktop (.exe)

on:
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify icon assets
        shell: bash
        run: |
          test -f assets/img/icon.ico || { echo "::error::assets/img/icon.ico missing"; exit 1; }
          test -f assets/img/icon.png || { echo "::error::assets/img/icon.png missing"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund --loglevel=warn

      - name: Build Windows installer
        env:
          DEBUG: electron-builder
        run: npm run dist:win

      - name: List build output
        if: always()
        shell: bash
        run: ls -lh dist-electron/ || echo "no dist-electron directory"

      - name: Upload .exe as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIVA-Setup-exe
          path: dist-electron/AIVA-Setup.exe
          if-no-files-found: error
          retention-days: 30
