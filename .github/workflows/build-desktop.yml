# =====================================================================
# AIVA Desktop · auto-build the Windows .exe
#
# Triggered:
#   • Manually from the Actions tab (workflow_dispatch)
#   • On every tag that starts with "v" (e.g. v1.0.0, v1.2.1)
#
# Output:
#   • dist-electron/AIVA-Setup-<version>.exe   (NSIS installer)
#   • dist-electron/AIVA-Portable-<version>.exe (single-file portable)
#   Both uploaded as workflow artifacts AND, on tag pushes, attached
#   to the matching GitHub Release.
#
# To cut a new release:
#   git tag v1.0.0
#   git push origin v1.0.0
# Wait ~3 minutes for the action to finish, then grab the .exe from
# https://github.com/gunantsingh-del/airindia/releases
# =====================================================================

name: Build AIVA Desktop (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      contents: write   # needed to attach the .exe to a Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer + portable
        env:
          # electron-builder picks this up to skip publishing (we attach via Release step)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aiva-desktop-windows
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
          if-no-files-found: error

      - name: Attach to Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
            dist-electron/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: false
