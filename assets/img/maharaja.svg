<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 480" width="320" height="480" aria-label="Air India Maharaja">
  <defs>
    <linearGradient id="mhRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E61926"/>
      <stop offset="100%" stop-color="#9A0E1B"/>
    </linearGradient>
    <linearGradient id="mhYel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE159"/>
      <stop offset="100%" stop-color="#E0A926"/>
    </linearGradient>
    <linearGradient id="mhFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8D6B0"/>
      <stop offset="100%" stop-color="#D9A877"/>
    </linearGradient>
    <radialGradient id="mhGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </radialGradient>
  </defs>

  <!-- Slipper toes (curl up at front) -->
  <path d="M 132 472 L 138 478 Q 142 478 146 472 L 158 470 Q 156 460 144 460 L 130 462 Z" fill="#E61926" stroke="#5A0815" stroke-width=".7"/>
  <path d="M 162 472 L 168 478 Q 172 478 176 472 L 188 470 Q 186 460 174 460 L 160 462 Z" fill="#E61926" stroke="#5A0815" stroke-width=".7"/>

  <!-- Churidar trousers (yellow legs visible below sherwani) -->
  <path d="M 130 405 L 134 462 L 152 462 L 154 405 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".5"/>
  <path d="M 162 405 L 162 462 L 180 462 L 184 405 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".5"/>
  <!-- Subtle ankle bands -->
  <line x1="135" y1="448" x2="151" y2="448" stroke="#876C28" stroke-width=".5"/>
  <line x1="163" y1="448" x2="183" y2="448" stroke="#876C28" stroke-width=".5"/>

  <!-- Long red sherwani coat — front-facing, A-line shape -->
  <path d="M 100 410 Q 95 320 105 250 Q 115 220 132 215 L 188 215 Q 205 220 215 250 Q 225 320 220 410
           Q 200 420 180 416 L 140 416 Q 120 420 100 410 Z"
        fill="url(#mhRed)" stroke="#5A0815" stroke-width="1"/>

  <!-- Yellow scalloped trim along coat hem (zig-zag pattern) -->
  <path d="M 100 410 Q 108 418 114 412 Q 122 420 128 412 Q 134 420 140 412 Q 148 420 154 412 Q 160 420 166 412 Q 174 420 180 412 Q 186 420 192 412 Q 200 420 206 412 Q 214 418 220 410 L 222 422 Q 214 428 206 426 Q 200 432 192 426 Q 186 432 180 426 Q 174 432 166 426 Q 160 432 154 426 Q 148 432 140 426 Q 134 432 128 426 Q 122 432 114 426 Q 108 432 100 422 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>

  <!-- Yellow scalloped neck collar -->
  <path d="M 130 218 Q 145 230 160 232 Q 175 230 190 218 L 192 232 Q 175 244 160 245 Q 145 244 128 232 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".5"/>

  <!-- Yellow buttons down center front -->
  <circle cx="160" cy="252" r="3" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>
  <circle cx="160" cy="278" r="3" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>
  <circle cx="160" cy="304" r="3" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>
  <circle cx="160" cy="330" r="3" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>

  <!-- Yellow cuffs on sleeves -->
  <ellipse cx="105" cy="345" rx="14" ry="7" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>
  <ellipse cx="215" cy="345" rx="14" ry="7" fill="url(#mhYel)" stroke="#876C28" stroke-width=".4"/>

  <!-- Hands together in NAMASTE prayer pose at chest -->
  <!-- Left hand -->
  <path d="M 148 290 Q 145 270 152 258 Q 158 255 160 268 L 160 320 Q 156 326 148 322 Z"
        fill="url(#mhFace)" stroke="#A87B5A" stroke-width=".7"/>
  <!-- Right hand -->
  <path d="M 172 290 Q 175 270 168 258 Q 162 255 160 268 L 160 320 Q 164 326 172 322 Z"
        fill="url(#mhFace)" stroke="#A87B5A" stroke-width=".7"/>
  <!-- Center crease between palms -->
  <line x1="160" y1="265" x2="160" y2="320" stroke="#A87B5A" stroke-width=".6"/>
  <!-- Fingertips at top (pointed up) -->
  <path d="M 152 258 Q 156 252 160 252 Q 164 252 168 258" stroke="#A87B5A" stroke-width=".5" fill="none"/>

  <!-- Forearms going down to hands (red sleeves angling inward) -->
  <path d="M 105 345 Q 115 320 148 290 L 152 296 Q 122 318 110 348 Z" fill="url(#mhRed)" stroke="#5A0815" stroke-width=".6"/>
  <path d="M 215 345 Q 205 320 172 290 L 168 296 Q 198 318 210 348 Z" fill="url(#mhRed)" stroke="#5A0815" stroke-width=".6"/>

  <!-- Neck -->
  <rect x="148" y="195" width="24" height="25" fill="url(#mhFace)" stroke="#A87B5A" stroke-width=".5"/>

  <!-- Head — round front-facing -->
  <ellipse cx="160" cy="160" rx="48" ry="50" fill="url(#mhFace)" stroke="#8A5630" stroke-width=".8"/>

  <!-- Ears -->
  <ellipse cx="113" cy="162" rx="7" ry="11" fill="url(#mhFace)" stroke="#8A5630" stroke-width=".5"/>
  <ellipse cx="207" cy="162" rx="7" ry="11" fill="url(#mhFace)" stroke="#8A5630" stroke-width=".5"/>

  <!-- Eyebrows (peaceful, slightly arched) -->
  <path d="M 130 138 Q 142 132 154 138" stroke="#1A1414" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M 166 138 Q 178 132 190 138" stroke="#1A1414" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- CLOSED peaceful eyes (curved lashes pointing down) -->
  <path d="M 132 152 Q 142 158 154 150" stroke="#1A1414" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M 166 152 Q 178 158 190 150" stroke="#1A1414" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Eyelash hint -->
  <line x1="138" y1="156" x2="137" y2="160" stroke="#1A1414" stroke-width="1" stroke-linecap="round"/>
  <line x1="148" y1="156" x2="148" y2="160" stroke="#1A1414" stroke-width="1" stroke-linecap="round"/>
  <line x1="172" y1="156" x2="172" y2="160" stroke="#1A1414" stroke-width="1" stroke-linecap="round"/>
  <line x1="183" y1="156" x2="183" y2="160" stroke="#1A1414" stroke-width="1" stroke-linecap="round"/>

  <!-- Nose (small round bump) -->
  <ellipse cx="160" cy="174" rx="5" ry="8" fill="#D9A877" opacity=".6"/>

  <!-- Iconic black handlebar mustache, fuller -->
  <path d="M 118 196 Q 138 188 158 196 Q 162 198 162 198 Q 162 198 162 198 Q 182 188 202 196
           Q 196 210 184 210 Q 170 204 162 204 Q 154 204 140 210 Q 128 210 118 196 Z"
        fill="#1A1414" stroke="#000" stroke-width=".5"/>
  <!-- Mustache curl tips (curl outward and up) -->
  <path d="M 118 196 Q 100 192 96 178 Q 100 188 110 192 Z" fill="#1A1414"/>
  <path d="M 202 196 Q 220 192 224 178 Q 220 188 210 192 Z" fill="#1A1414"/>

  <!-- Goatee/chin tuft (small) -->
  <ellipse cx="160" cy="216" rx="4" ry="5" fill="#1A1414"/>

  <!-- ====== TURBAN — striped red + yellow ====== -->
  <!-- Base outline -->
  <path d="M 100 122 Q 102 78 160 68 Q 218 78 220 122 Q 224 134 212 142 Q 188 96 160 94 Q 132 96 108 142 Q 96 134 100 122 Z"
        fill="url(#mhRed)" stroke="#5A0815" stroke-width="1"/>

  <!-- Horizontal yellow stripes wrapping around the turban -->
  <path d="M 102 118 Q 160 96 218 118 L 215 124 Q 160 102 105 124 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".3"/>
  <path d="M 104 110 Q 160 88 216 110 L 213 116 Q 160 94 107 116 Z" fill="url(#mhRed)"/>
  <path d="M 106 102 Q 160 80 214 102 L 211 108 Q 160 86 109 108 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".3"/>
  <path d="M 108 94 Q 160 72 212 94 L 209 100 Q 160 78 111 100 Z" fill="url(#mhRed)"/>
  <path d="M 110 86 Q 160 64 210 86 L 207 92 Q 160 70 113 92 Z" fill="url(#mhYel)" stroke="#876C28" stroke-width=".3"/>

  <!-- Turban crown wrap at top -->
  <path d="M 130 76 Q 160 60 190 76 Q 178 80 160 78 Q 142 80 130 76 Z" fill="url(#mhRed)" stroke="#5A0815" stroke-width=".6"/>

  <!-- Green jewel/brooch on turban front -->
  <circle cx="160" cy="92" r="6" fill="url(#mhGreen)" stroke="#0F5C2C" stroke-width=".7"/>
  <circle cx="159" cy="91" r="2" fill="#A4F0BD" opacity=".7"/>

  <!-- Yellow tassels/feather plume streaming up from turban top -->
  <g transform="translate(160 68)">
    <path d="M 0 0 L -4 -36" stroke="url(#mhYel)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L -2 -42" stroke="url(#mhYel)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L 0 -44" stroke="url(#mhYel)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M 0 0 L 2 -42" stroke="url(#mhYel)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L 4 -36" stroke="url(#mhYel)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 0 0 L -6 -28" stroke="url(#mhYel)" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <path d="M 0 0 L 6 -28" stroke="url(#mhYel)" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
    <!-- binding -->
    <ellipse cx="0" cy="-2" rx="4" ry="3" fill="#E61926" stroke="#876C28" stroke-width=".5"/>
  </g>
</svg>
